openapi: 3.0.3
info:
  title: Polymorphic fixture
  version: "1.0"
components:
  schemas:
    Dog:
      type: object
      required:
        - petType
      properties:
        petType:
          type: string
        bark:
          type: boolean
    Cat:
      type: object
      required:
        - petType
      properties:
        petType:
          type: string
        lives:
          type: integer
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Cat"
      discriminator:
        propertyName: petType
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
    AnyPet:
      anyOf:
        - $ref: "#/components/schemas/Dog"
        - type: object
          properties:
            color:
              type: string
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: ok
  /any:
    post:
      operationId: createAny
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnyPet"
      responses:
        "200":
          description: ok
