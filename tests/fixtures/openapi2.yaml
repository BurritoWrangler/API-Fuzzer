swagger: "2.0"
info:
  title: Swagger 2 fixture
  version: "1.0"
host: api.example.com
basePath: /v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  api_key:
    type: apiKey
    name: X-API-Key
    in: header
  basic_auth:
    type: basic
security:
  - api_key: []
definitions:
  Item:
    type: object
    required:
      - name
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      name:
        type: string
      tags:
        type: array
        items:
          type: string
  TaggedItem:
    allOf:
      - $ref: "#/definitions/Item"
      - type: object
        properties:
          tag:
            type: string
paths:
  /items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        type: integer
    get:
      operationId: getItem
      produces:
        - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: "#/definitions/Item"
      security:
        - api_key: []
    put:
      operationId: updateItem
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Item"
      responses:
        "200":
          description: ok
  /items:
    post:
      operationId: createItem
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - name: name
          in: formData
          required: true
          type: string
        - name: active
          in: formData
          type: boolean
      responses:
        "201":
          description: created
  /uploads:
    post:
      operationId: upload
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          required: true
          type: file
        - name: label
          in: formData
          type: string
      responses:
        "204":
          description: uploaded
